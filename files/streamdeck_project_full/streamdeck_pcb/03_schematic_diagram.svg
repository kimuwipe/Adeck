  <text class="ts" x="125" y="244" text-anchor="middle">SW8 + ENC-Push4</text>
  <path d="M210 230 L240 230 L240 350 L270 350" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="510" width="170" height="56" rx="8" class="gray" stroke-width="0.5"/>
  <text class="th" x="125" y="532" text-anchor="middle">Switches x8</text>
