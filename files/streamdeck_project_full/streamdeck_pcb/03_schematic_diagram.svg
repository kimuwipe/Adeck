  <line x1="340" y1="96" x2="340" y2="120" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="180" width="170" height="80" rx="8" class="blue" stroke-width="0.5"/>
  <text class="th" x="125" y="208" text-anchor="middle">MCP23017</text>
