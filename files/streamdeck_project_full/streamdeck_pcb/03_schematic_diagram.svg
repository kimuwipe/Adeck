<svg width="100%" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .ts { font-size: 12px; fill: #555; }
    .green { fill: #EAF3DE; stroke: #639922; }
    .red { fill: #FCEBEB; stroke: #A32D2D; }
    .amber { fill: #FAEEDA; stroke: #BA7517; }
    .blue { fill: #E6F1FB; stroke: #185FA5; }
    .gray { fill: #F1EFE8; stroke: #888780; }
    .coral { fill: #FAECE7; stroke: #D85A30; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; }
    .purple { fill: #EEEDFE; stroke: #534AB7; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="270" y="330" width="140" height="120" rx="12" class="green" stroke-width="0.5"/>
  <text class="th" x="340" y="375" text-anchor="middle">Raspberry Pi</text>
  <text class="th" x="340" y="395" text-anchor="middle">Pico 2</text>
  <text class="ts" x="340" y="418" text-anchor="middle">RP2350</text>
  <rect x="270" y="120" width="140" height="56" rx="8" class="red" stroke-width="0.5"/>
  <text class="th" x="340" y="142" text-anchor="middle">Power</text>
