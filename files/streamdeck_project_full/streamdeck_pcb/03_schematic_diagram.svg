  <path d="M210 370 L270 370" stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="470" y="180" width="170" height="90" rx="8" class="teal" stroke-width="0.5"/>
  <text class="th" x="555" y="208" text-anchor="middle">LCD1 Touch</text>
  <text class="ts" x="555" y="227" text-anchor="middle">CS=GP17</text>
  <text class="ts" x="555" y="244" text-anchor="middle">BL=GP26 / I2C0</text>
