  <line x1="340" y1="176" x2="340" y2="330" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="40" width="140" height="56" rx="8" class="amber" stroke-width="0.5"/>
  <text class="th" x="340" y="62" text-anchor="middle">USB-C</text>
